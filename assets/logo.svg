<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A1B26"/>
      <stop offset="100%" stop-color="#11121A"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="48" y1="36" x2="208" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="sapphireGrad" x1="64" y1="64" x2="192" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DCFFF"/>
      <stop offset="100%" stop-color="#7AA2F7"/>
    </linearGradient>
    <filter id="glow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Badge -->
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#bgGrad)" stroke="#292E42" stroke-width="3"/>
  <rect x="20" y="20" width="216" height="216" rx="44" stroke="#F59E0B" stroke-Opacity="0.18" stroke-width="1.5"/>

  <!-- Isometric Terraced Quarry Layers (representing structured REST data strata) -->
  <g filter="url(#glow)">
    <!-- Outer Hexagonal Rim -->
    <polygon points="128,40 204,84 204,172 128,216 52,172 52,84" fill="#1F2335" stroke="url(#amberGrad)" stroke-width="5" stroke-linejoin="round"/>
    
    <!-- Middle Stratum -->
    <polygon points="128,66 182,97 182,159 128,190 74,159 74,97" fill="#161824" stroke="url(#sapphireGrad)" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Inner Core Crystal -->
    <polygon points="128,92 158,110 158,146 128,164 98,146 98,110" fill="url(#amberGrad)" opacity="0.92"/>
    
    <!-- Isometric Facet Lines -->
    <line x1="128" y1="40" x2="128" y2="92" stroke="#F59E0B" stroke-width="2.5" stroke-opacity="0.55"/>
    <line x1="204" y1="84" x2="158" y2="110" stroke="#7AA2F7" stroke-width="2.5" stroke-opacity="0.55"/>
    <line x1="52" y1="84" x2="98" y2="110" stroke="#7AA2F7" stroke-width="2.5" stroke-opacity="0.55"/>

    <!-- Quarry Q-Tail / Chisel Extraction Beam (bottom-right) -->
    <path d="M144 144 L206 206" stroke="url(#amberGrad)" stroke-width="12" stroke-linecap="round"/>
    <path d="M144 144 L206 206" stroke="#FEF3C7" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

    <!-- Central Core Highlight -->
    <polygon points="128,92 158,110 128,128 98,110" fill="#FEF3C7" opacity="0.35"/>
  </g>
</svg>
